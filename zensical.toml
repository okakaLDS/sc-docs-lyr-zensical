[project]
site_name = "半導体顧客向け基本設計書"
site_description = "SC様向け基本設計書（成果物一覧 項番1〜11）。保守工程では生成AIの入力資料として影響調査に使う。"
site_author = "KCCS"
site_url = "https://okakalds.github.io/sc-docs-lyr-zensical/"
copyright = "Copyright &copy; 2026 KCCS — 設計書の正本は MkDocs版 sc-docs-lyr"
dev_addr = "127.0.0.1:8001"

# 正本リポジトリを指す（「このページを編集」は正本の該当ファイルが開く）
repo_url = "https://github.com/okakaLDS/sc-docs-lyr"
repo_name = "okakaLDS/sc-docs-lyr"
edit_uri = "edit/main/docs/"

# 正本の stylesheets/extra.css・javascripts/extra.js は同期されるが読み込まない
# （配色・装飾はZensical版独自。表紙の押印枠など本文が依存するスタイルだけ site.css に持つ）
extra_css = [
  "assets/zensical/site.css",
]
extra_javascript = [
  "https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js",  # 表の並べ替え
  "assets/zensical/site.js",
]

