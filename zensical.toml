SC様向け基本設計書。商流は SC（お客様）→ KCCS → ベンダー。
各ドキュメントは1フォルダに [使い方]（書き方）／[Template]（記入用の雛形）／[Sample]（記入例）の3ページを置く。
front matter の owner が担当（KCCS / SC様）、status が作業状況。保守工程の影響調査に使う。
"""

