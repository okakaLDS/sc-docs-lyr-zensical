# -----------------------------------------------------------------------------
# Markdown拡張（正本 mkdocs.yml と同じ解釈になるものだけ有効にする）
#
# 有効にしてはいけないもの:
#   attr_list … 見出し末尾の {機能ID} 等のプレースホルダーが属性として消える
#   pymdownx.magiclink / smartsymbols / caret / tilde / mark …
#     VSCodeプレビュー・MkDocs版と表示が食い違う
# -----------------------------------------------------------------------------
[project.markdown_extensions]
abbr = {}
admonition = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
