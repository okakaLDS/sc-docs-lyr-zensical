<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="半導体顧客向け基本設計書">
  <!-- 設計書（右上が折れたページ）× ICチップ（左右のピン）。中の銅配線とノードは「仕様の結線」 -->
  <defs>
    <linearGradient id="zx-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2B47"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="zx-cu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2B27A"/>
      <stop offset="1" stop-color="#C9763A"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#zx-bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" fill="none" stroke="#7FA4FF" stroke-opacity="0.28"/>

  <!-- ピン -->
  <g stroke="#7FA4FF" stroke-width="3" stroke-linecap="round">
    <path d="M10 25h6M10 33h6M10 41h6"/>
    <path d="M48 29h6M48 37h6M48 45h6"/>
  </g>

  <!-- ページ -->
  <path d="M19 12h19l9 9v31a1 1 0 0 1-1 1H19a1 1 0 0 1-1-1V13a1 1 0 0 1 1-1z"
        fill="#0E1726" stroke="#E6EAF0" stroke-width="3" stroke-linejoin="round"/>
  <path d="M38 12v8a1 1 0 0 0 1 1h8" fill="none" stroke="#E6EAF0" stroke-width="3" stroke-linejoin="round"/>

  <!-- 記述（行） -->
  <g stroke="#E6EAF0" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round">
    <path d="M24 22h8"/>
    <path d="M24 46h8"/>
  </g>

  <!-- 銅配線とノード -->
  <path d="M24 30h7l5 5v5" fill="none" stroke="url(#zx-cu)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="24" cy="30" r="2.6" fill="#F2B27A"/>
  <circle cx="36" cy="41" r="3.6" fill="url(#zx-cu)"/>
</svg>
